<!DOCTYPE html>
<html lang="en">
<head>

<title>OpenWithLove • Anniversary Surprise</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Serif+Display:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap');
:root{--red:#8875b1;--deep:#51436f;--cream:#f0ebf8;--pink:#df91ae;--pale:#d1c3e9;--gold:#d3aa57;--ink:#332a43;--white:#fffaff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Poppins,sans-serif;background:#13070c;color:var(--ink)}body{overflow-x:hidden}
button{font:inherit}.screen{display:none;min-height:100svh;position:relative;overflow:hidden}.screen.active{display:flex;animation:pageIn .65s cubic-bezier(.22,.8,.22,1) both}@keyframes pageIn{from{opacity:0}to{opacity:1}}
.brand{position:absolute;top:17px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:4px;color:#fff;opacity:.78;z-index:50}.back{position:absolute;right:20px;top:18px;border:0;background:#fff;border-radius:20px;color:var(--red);font-weight:700;padding:7px 16px;z-index:50;cursor:pointer}
.btn{border:0;background:#fff;color:var(--red);border-radius:999px;padding:12px 30px;font-weight:700;cursor:pointer;box-shadow:0 8px 22px #6b001e2b;transition:transform .2s}.btn:active{transform:scale(.96)}
/* 1 */
#password{background:var(--red);align-items:stretch}.pass-wrap{width:min(1250px,100%);margin:auto;display:grid;grid-template-columns:1.08fr .92fr;min-height:100svh}
.pass-left{background:var(--cream);position:relative;display:flex;align-items:center;justify-content:center;padding:70px 5vw;overflow:hidden}.pass-left:before{content:"";position:absolute;inset:0;background:radial-gradient(#d10b48 0 5px,transparent 6px);background-size:42px 42px;opacity:.95}
.heart-frame{width:min(480px,70vw);aspect-ratio:1/.92;position:relative;z-index:1;display:grid;place-items:center;animation:heartFloat 3.5s ease-in-out infinite}@keyframes heartFloat{50%{transform:translateY(-7px)}}
.heart-frame:before{content:"";position:absolute;width:87%;height:87%;background:#fff;clip-path:polygon(50% 92%,7% 45%,8% 27%,17% 15%,32% 12%,50% 30%,68% 12%,83% 15%,92% 27%,93% 45%);box-shadow:0 12px 30px #6d173444}
.photo{position:relative;width:68%;height:70%;z-index:2;background:linear-gradient(145deg,#ef9fb8,#c04b70);clip-path:polygon(50% 95%,5% 47%,7% 27%,18% 15%,33% 14%,50% 33%,67% 14%,82% 15%,93% 27%,95% 47%);display:grid;place-items:center;color:#7d1239;text-align:center;font-size:13px;font-weight:600}
.pass-right{background:var(--red);color:white;display:flex;align-items:center;justify-content:center;padding:65px 5vw}.pass-card{width:min(390px,100%);text-align:center}.lock{font-size:28px;margin-bottom:5px}.pass-card h2{font-size:20px;margin:5px 0 15px}.boxes{display:flex;justify-content:center;gap:10px;margin:15px 0 22px}.box{width:49px;height:52px;border:3px solid white;border-radius:7px;display:grid;place-items:center;font-size:23px;font-weight:700;background:#fff1}.box.active{animation:activeBox .65s ease infinite alternate}@keyframes activeBox{to{box-shadow:0 0 0 5px #ffffff2b}}
.keypad{width:275px;max-width:100%;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.key{border:0;border-radius:50%;aspect-ratio:1;background:white;color:var(--red);font-weight:700;font-size:19px;cursor:pointer;transition:.15s}.key:active{transform:scale(.9)}.enter{grid-column:1/-1;border-radius:30px;aspect-ratio:auto;padding:12px}
.error-layer{position:absolute;inset:0;background:var(--red);display:none;z-index:80;align-items:center;justify-content:center;text-align:center;color:white}.error-layer.show{display:flex;animation:errorIn .35s ease both}@keyframes errorIn{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}.error-title{font-family:monospace;font-size:clamp(45px,8vw,95px);font-weight:700}.stamp{font-family:Georgia;border:5px solid white;padding:8px 20px;font-size:34px;display:inline-block;transform:rotate(-3deg);margin:8px}
/* 4/5 */
#surprise{background:var(--red);align-items:stretch}.choice-wrap{width:min(1250px,100%);margin:auto;display:grid;grid-template-columns:1.05fr .95fr;min-height:100svh}.memory-side{background:var(--cream);position:relative;overflow:hidden;background-image:radial-gradient(#d30a48 0 5px,transparent 6px);background-size:43px 43px;display:flex;align-items:center;justify-content:center}.memory-heart{position:absolute;width:380px;height:380px;background:var(--gold);clip-path:polygon(50% 93%,7% 45%,8% 27%,17% 15%,32% 12%,50% 30%,68% 12%,83% 15%,92% 27%,93% 45%);transform:scale(.2) rotate(-12deg);opacity:0;transition:1s cubic-bezier(.2,.9,.2,1)}.memory-heart.h2{transform:scale(.2) rotate(12deg);background:#e4bd6d}.memory-heart img,.memory-heart .photo2{position:absolute;inset:16%;background:linear-gradient(145deg,#b75a75,#f0b2c1);clip-path:inherit;display:grid;place-items:center;color:#fff}.memory-side.revealed .memory-heart{opacity:1;transform:scale(1) rotate(-5deg);}.memory-side.revealed .h2{transform:scale(1) rotate(5deg);margin-left:260px}.memory-side.revealed .h1{margin-left:-190px}
.choice-side{background:var(--red);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}.choice-side h1{font-family:Caveat;font-size:clamp(48px,6vw,76px);line-height:.95;margin:8px 0 20px}.couple{font-size:70px;margin:0 0 16px}.choice{display:flex;gap:18px}.choice .btn{min-width:105px}
#nope{background:var(--red);color:white;flex-direction:column;align-items:center;justify-content:center;text-align:center}.no-couple{font-size:110px;animation:shake .5s ease both}@keyframes shake{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
#nope h1{font-family:Caveat;font-size:clamp(55px,8vw,100px);margin:5px}
/* 8 */
#gifts{background:var(--cream);color:var(--red);align-items:center;justify-content:center;background-image:radial-gradient(#d10a47 0 6px,transparent 7px);background-size:42px 42px}.gifts-inner{width:min(1150px,100%);text-align:center;padding:65px 20px 35px}.gifts-title{font-family:Caveat;font-size:clamp(44px,6vw,72px);margin:0 0 40px}.gift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,5vw,65px);align-items:end}.gift{border:0;background:none;cursor:pointer;color:var(--red);font-weight:700;animation:giftIn .8s both}.gift:nth-child(2){animation-delay:.12s}.gift:nth-child(3){animation-delay:.24s}@keyframes giftIn{from{opacity:0;transform:translateY(55px) scale(.85)}to{opacity:1;transform:none}}.gift:hover .giftbox{transform:translateY(-10px) rotate(-1deg)}.giftbox{height:190px;position:relative;background:linear-gradient(90deg,#b50039,#df0b4e);border-radius:5px;box-shadow:0 18px 28px #76002633;transition:.3s}.giftbox:before{content:"";position:absolute;left:43%;width:14%;height:100%;background:#e5bd66}.giftbox:after{content:"";position:absolute;left:32%;top:-35px;width:35%;height:48px;border:11px solid #e5bd66;border-radius:50%;transform:rotate(-7deg)}.gift-label{display:inline-block;margin-top:17px;background:#fff;border-radius:22px;padding:8px 22px}
/* 9/10 */
#gift1{background:var(--red);color:white;align-items:center;justify-content:center}.gift1-layout{width:min(1180px,100%);display:grid;grid-template-columns:1.1fr .5fr .95fr;gap:24px;align-items:center;padding:70px 25px 30px}.note-panel{background:var(--cream);padding:35px 28px;min-height:460px;box-shadow:0 16px 40px #4e001b55;transform:rotate(-1.5deg);animation:slideLeft .8s both}@keyframes slideLeft{from{opacity:0;transform:translateX(-80px) rotate(-4deg)}to{opacity:1;transform:rotate(-1.5deg)}}.note-panel h2{font-family:Caveat;color:var(--red);font-size:45px;margin:0 0 12px}.note-panel p{font-family:Caveat;font-size:21px;line-height:1.35}.vertical-photos{background:#f3b8c9;padding:12px 11px;box-shadow:0 18px 35px #4e001b44;animation:photoRise .8s .15s both}@keyframes photoRise{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}.mini{height:135px;background:linear-gradient(145deg,#bf5576,#e9a6b8);margin-bottom:10px;display:grid;place-items:center;color:#fff;font-size:11px}.mini:last-child{margin-bottom:0}.envelope{height:250px;background:#f4a9c0;position:relative;cursor:pointer;box-shadow:0 18px 35px #4e001b44;animation:envIn .8s .25s both}@keyframes envIn{from{opacity:0;transform:translateX(80px) rotate(4deg)}to{opacity:1;transform:none}}.envelope:before{content:"";position:absolute;inset:0;border-left:50% solid transparent;border-right:50% solid transparent;border-top:125px solid #ffe8ef}.envelope:after{content:"";position:absolute;left:0;right:0;bottom:0;border-left:50% solid transparent;border-right:50% solid transparent;border-bottom:125px solid #f8c4d3}.open-text{position:absolute;z-index:3;top:100px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;padding:10px 20px;color:var(--red);font-family:Caveat;font-size:28px;font-weight:700;text-decoration:underline;border-radius:4px}
/* letter */
#letter{background:var(--red);padding:60px 25px;align-items:center;justify-content:center}.letter-page{max-width:1050px;background:var(--cream);padding:45px;min-height:75svh;border:9px solid #d50a46;box-shadow:0 20px 55px #4e001b55;color:#61253a;position:relative;animation:paperOpen .8s both}@keyframes paperOpen{from{opacity:0;transform:scaleX(.55)}to{opacity:1;transform:none}}.letter-page h2{font-family:Caveat;color:var(--red);font-size:58px;margin:0 0 15px}.letter-page p{font-family:Caveat;font-size:23px;line-height:1.45}.letter-photo{float:right;width:240px;height:330px;margin:0 0 20px 30px;background:linear-gradient(145deg,#d27a96,#f0b3c2);display:grid;place-items:center;text-align:center;color:#7d163d}
/* 13 */
#gift2{background:var(--red);color:white;align-items:center;justify-content:center;padding:55px 20px}.gift2-layout{width:min(1100px,100%);background:#efb5c7;min-height:75svh;position:relative;padding:55px 55px;overflow:hidden;display:grid;grid-template-columns:1.2fr .8fr;align-items:center}.calendar-page{color:#bd003b;position:relative}.calendar-page:before{content:"13";position:absolute;left:0;top:-35px;font-size:20px}.calendar-page:after{content:"14";position:absolute;left:55%;top:-15px;font-family:Caveat;font-size:28px}.daytitle{font-family:Caveat;color:#fff;background:#b9003a;padding:45px 35px;font-size:65px;line-height:.85;width:min(470px,100%);transform:rotate(-5deg);box-shadow:0 15px 30px #5d001e33}.calendar-decor{font-size:55px;color:#bd003b;margin-top:20px}.g2-photos{display:grid;gap:12px}.g2-photo{height:200px;background:linear-gradient(145deg,#c25b79,#f1b2c3);border:7px solid #b9003a;display:grid;place-items:center;color:#fff;font-size:12px}.g2-photo:nth-child(2){transform:translateX(25px)}
/* 15/16 */
#gift3{background:var(--red);color:white;align-items:center;justify-content:center;padding:55px 25px}.gift3-layout{width:min(1100px,100%);display:grid;grid-template-columns:1fr .9fr;align-items:center;gap:45px}.g3-photo{min-height:510px;background:linear-gradient(145deg,#b84e70,#f0a9bb);display:grid;place-items:center;color:white;border:0;box-shadow:0 20px 45px #52001c55}.g3-copy{text-align:left}.twentyone{font-family:Caveat;font-size:clamp(130px,17vw,220px);color:#a9d0e5;line-height:.55}.g3-copy h1{font-family:Georgia;font-weight:400;font-size:clamp(48px,6vw,80px);line-height:.95;margin:35px 0;color:white}.arrow{font-size:45px;color:white;background:none;border:0;cursor:pointer;float:right}.reasons-screen{background:var(--red);padding:55px 25px;align-items:center;justify-content:center}.notebook{width:min(1050px,100%);background:var(--cream);color:#522239;padding:45px 55px;min-height:75svh;box-shadow:0 25px 55px #4e001b55;border-left:15px solid #d00a46;animation:notebookIn .75s both}@keyframes notebookIn{from{opacity:0;transform:translateX(100px) rotate(2deg)}to{opacity:1;transform:none}}.notebook h2{font-family:Caveat;color:var(--red);font-size:55px;margin:0 0 15px}.notebook ol{columns:2;column-gap:60px}.notebook li{font-size:18px;margin:7px 0;break-inside:avoid}
/* mobile */
@media(max-width:800px){
 .pass-wrap,.choice-wrap{grid-template-columns:1fr}.pass-left{min-height:43svh;padding:55px 20px 10px}.pass-right{min-height:57svh;padding:20px}.heart-frame{width:280px}.pass-card{width:310px}.keypad{width:250px}
 .memory-side{min-height:47svh}.choice-side{min-height:53svh;padding:20px}.memory-heart{width:230px;height:230px}.memory-side.revealed .h2{margin-left:145px}.memory-side.revealed .h1{margin-left:-110px}
 .gift-grid{grid-template-columns:1fr;max-width:250px;margin:auto}.giftbox{height:135px}.gifts-title{margin-bottom:20px}
 .gift1-layout{grid-template-columns:1fr 1fr;padding:65px 14px 25px}.note-panel{grid-column:1/-1;min-height:250px}.vertical-photos{grid-column:1}.envelope{grid-column:2;height:190px}.open-text{top:75px;font-size:22px}
 .letter-page{padding:25px 20px;min-height:80svh}.letter-photo{float:none;width:100%;height:210px;margin:0 0 15px}.letter-page p{font-size:20px}
 .gift2-layout{grid-template-columns:1fr;padding:45px 18px}.daytitle{font-size:53px}.g2-photos{grid-template-columns:1fr 1fr;margin-top:25px}.g2-photo{height:170px}.g2-photo:nth-child(2){transform:none}
 .gift3-layout{grid-template-columns:1fr;gap:18px}.g3-photo{min-height:300px}.g3-copy{text-align:center}.twentyone{font-size:135px}.g3-copy h1{font-size:48px;margin:25px 0}.arrow{float:none}
 .notebook{padding:30px 25px}.notebook ol{columns:1}.notebook h2{font-size:45px}
}

/* A softer, richer palette with a little more movement throughout the experience. */
body{background:#24171b}
.btn,.back{background:var(--white);color:var(--deep)}
.btn{box-shadow:0 9px 24px #35121f38;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,background-color .28s}
.btn:hover,.back:hover{transform:translateY(-3px);box-shadow:0 13px 28px #35121f40}
.back{transition:transform .25s,box-shadow .25s}
.key{background:var(--white);color:var(--deep);box-shadow:0 5px 14px #35121f22;transition:transform .22s,box-shadow .22s,background-color .22s}
.key:hover{transform:translateY(-3px);box-shadow:0 9px 18px #35121f30}
.pass-left:before,.memory-side,#gifts{background-image:radial-gradient(rgba(168,68,94,.27) 0 5px,transparent 6px)}
.pass-left:before{animation:patternDrift 32s linear infinite}
.memory-side{background-image:radial-gradient(rgba(168,68,94,.25) 0 5px,transparent 6px);animation:patternDrift 36s linear infinite}
#gifts{background-image:radial-gradient(rgba(168,68,94,.25) 0 6px,transparent 7px);animation:patternDrift 38s linear infinite}
.screen.active{animation:screenBloom .85s cubic-bezier(.18,.75,.25,1) both}
.heart-frame{animation:heartFloat 3.1s ease-in-out infinite,heartGlow 4.2s ease-in-out infinite}
.heart-frame:before{filter:drop-shadow(0 15px 22px #71324635)}
.memory-heart{transition:1.15s cubic-bezier(.16,.9,.25,1)}
.memory-side.revealed .memory-heart{animation:heartReveal 1.15s cubic-bezier(.16,.9,.25,1) both}
.memory-side.revealed .h2{animation-delay:.16s}
.couple,.no-couple{animation:softBounce 2.5s ease-in-out infinite}
.no-couple{animation:shake .5s ease both,softBounce 2.5s .5s ease-in-out infinite}
.gift{animation:giftIn .85s cubic-bezier(.2,.8,.2,1) both}
.giftbox{background:linear-gradient(115deg,#84364d,#ad5368 48%,#84364d);background-size:220% 100%;animation:giftShimmer 6s ease-in-out infinite;transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.gift:hover .giftbox{transform:translateY(-13px) rotate(-2deg) scale(1.035);box-shadow:0 24px 34px #51203348}
.giftbox:before,.giftbox:after{background-color:var(--gold)}
.giftbox:after{background-color:transparent}
.gift-label{background:var(--white);color:var(--deep);transition:transform .3s,background-color .3s}
.gift:hover .gift-label{transform:translateY(3px);background:#ead9bc}
.photo,.mini,.g2-photo,.g3-photo,.letter-photo{background:linear-gradient(145deg,#bd7583,#8f465b)}
.note-panel,.vertical-photos,.letter-page,.calendar-page,.notebook{box-shadow:0 18px 42px #35121f35}
.pass-card{animation:contentRise .9s .15s both}
#surprise.active .choice-side,#nope.active h1,#nope.active .btn{animation:contentRise .8s .18s both}
#gifts.active .gifts-title{animation:contentRise .8s .1s both}
#gift1.active .note-panel,#gift2.active .calendar-page,#gift3.active .g3-copy,#reasons.active .notebook,#letter.active .letter-page{animation:contentRise .85s cubic-bezier(.2,.8,.2,1) both}
.vertical-photos,.g2-photo,.g3-photo,.letter-photo{transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
.vertical-photos:hover,.g2-photo:hover,.g3-photo:hover,.letter-photo:hover{transform:translateY(-7px) rotate(1deg);box-shadow:0 22px 38px #35121f42}
.arrow{transition:transform .25s,background-color .25s}
.arrow:hover{transform:translateX(6px) scale(1.08)}
@keyframes screenBloom{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes contentRise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes patternDrift{to{background-position:42px 42px}}
@keyframes heartGlow{50%{filter:drop-shadow(0 9px 16px #a8445e22)}}
@keyframes heartReveal{from{opacity:0;scale:.5}to{opacity:1;scale:1}}
@keyframes softBounce{50%{transform:translateY(-8px)}}
@keyframes giftShimmer{50%{background-position:100% 0}}
.screen#password,.screen#surprise,.screen#nope,.screen#gift1,.screen#letter,.screen#gift2,.screen#gift3,.screen.reasons-screen{background:linear-gradient(135deg,#642137 0%,#96394f 52%,#74273e 100%)}
.pass-left,.memory-side{background-color:var(--cream)}
.pass-left:before,.memory-side,#gifts{background-image:radial-gradient(rgba(133,35,57,.15) 0 4px,transparent 5px)}
#gifts{background-color:#d8b0b7;background-image:radial-gradient(rgba(110,31,53,.13) 0 5px,transparent 6px),radial-gradient(ellipse at 50% 20%,rgba(255,239,240,.4),transparent 65%);background-size:44px 44px,100% 100%}
#gifts .brand{color:var(--deep);opacity:.72}
.giftbox{background:linear-gradient(115deg,#7e293f,#a94159 48%,#74243a);background-size:220% 100%;box-shadow:0 18px 30px #4f102b40}
.giftbox:before{background:linear-gradient(90deg,#c57987,#d99aa5,#bd6c7b)}
.giftbox:after{border-color:#d99aa5}
.gift-label{background:#fff5f3}
.gift:hover .gift-label{background:#e8c5ca}
.memory-heart,.memory-heart.h2{background:#ae5369}
.memory-heart.h2{background:#c77a88}
.daytitle{background:#822940}
.gift2-layout{background:#d8a0a8}
.gift3-layout .twentyone{color:#d99aa5;text-shadow:0 5px 0 #72263c}
.calendar-decor{color:#872b43}
.vertical-photos{background:#d99aa5}
.envelope{background:#cf8795}
.envelope:before{border-top-color:#f1d9dc}
.envelope:after{border-bottom-color:#e4b6bd}
.btn,.back,.key{color:var(--deep)}
.btn{background:var(--white)}
.heart-frame:before{background:#fff7f5}
.choice-side h1,.note-panel h2,.letter-page h2,.notebook h2{ text-shadow:0 2px 0 rgba(64,14,34,.08)}
.gift{transform-origin:center bottom}
.gift.opening{animation:giftOpen .52s cubic-bezier(.2,.8,.2,1) both}
.gift.opening .giftbox{animation:giftBoxBurst .52s cubic-bezier(.2,.8,.2,1) both}
.giftbox:after{animation:bowSway 3s ease-in-out infinite}
.gift:hover .giftbox:after{animation:bowPop .42s ease both}
.heart-frame{animation:heartFloat 3.1s ease-in-out infinite,heartGlow 4.2s ease-in-out infinite,heartBeat 2.4s ease-in-out infinite}
.gifts-title{color:#78283f;text-shadow:0 3px 0 #fff7f5}
.giftbox,.gift-label,.btn,.back,.key,.arrow{will-change:transform}
#celebration{position:fixed;inset:0;z-index:1000;overflow:hidden;pointer-events:none}
.love-particle{position:absolute;left:var(--x);bottom:-12vh;color:var(--particle-color);font-size:var(--size);opacity:0;line-height:1;text-shadow:0 3px 14px rgba(76,12,34,.24);animation:loveRise var(--duration) cubic-bezier(.16,.62,.3,1) var(--delay) both}
@keyframes loveRise{0%{opacity:0;transform:translate3d(0,0,0) rotate(-18deg) scale(.45)}12%{opacity:.9}75%{opacity:.82}100%{opacity:0;transform:translate3d(var(--drift),-120vh,0) rotate(24deg) scale(1.2)}}
@keyframes heartBeat{0%,100%{scale:1}8%{scale:1.035}16%{scale:1}24%{scale:1.02}32%{scale:1}}
@keyframes giftOpen{45%{transform:translateY(-10px) scale(1.08)}100%{transform:translateY(-6px) scale(1.03)}}
@keyframes giftBoxBurst{45%{transform:translateY(-20px) rotate(-3deg) scale(1.1)}100%{transform:translateY(-13px) rotate(-2deg) scale(1.035)}}
@keyframes bowSway{50%{transform:rotate(7deg) scale(1.04)}}
@keyframes bowPop{50%{transform:rotate(12deg) scale(1.2)}}
.gifts-inner{width:min(1050px,calc(100% - 44px));padding:clamp(34px,6vh,70px) clamp(18px,4vw,48px);border:1px solid #8f435645;border-radius:26px;background:linear-gradient(145deg,rgba(255,244,244,.66),rgba(238,211,215,.45));box-shadow:0 26px 70px #56182b30,inset 0 1px 0 #fff9;backdrop-filter:blur(5px)}
.gifts-heading{margin-bottom:clamp(26px,5vh,48px)}
.scene-kicker{display:inline-block;color:#7d3448;font-size:10px;font-weight:700;letter-spacing:3px;margin-bottom:9px}
.gifts-title{font-family:"DM Serif Display",Georgia,serif;font-size:clamp(36px,5.5vw,62px);line-height:1.05;margin:0;color:#70253b;text-shadow:none}
.gifts-subtitle{margin:12px 0 0;color:#6c3948;font-family:Caveat,cursive;font-size:clamp(19px,2.5vw,26px)}
.gift-grid{gap:clamp(10px,3vw,38px);align-items:stretch}
.gift{display:flex;flex-direction:column;align-items:center;min-width:0;padding:14px 12px 17px;border:1px solid transparent;border-radius:20px;color:#572032;transition:background .35s,border-color .35s,transform .35s;animation:giftCardIn .85s cubic-bezier(.2,.8,.2,1) both}
.gift:hover{background:#f5e5e6a8;border-color:#a84e6252;transform:translateY(-5px)}
.gift:nth-child(2){animation-delay:.14s}.gift:nth-child(3){animation-delay:.28s}
.gift-scene{height:clamp(152px,22vw,224px);width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;isolation:isolate}
.giftbox{width:min(190px,82%);height:62%;position:relative;z-index:1;overflow:visible;border-radius:5px 5px 9px 9px;background:linear-gradient(100deg,#732239,#a83d55 46%,#7c263e);box-shadow:0 18px 28px #57172b45;transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .45s}
.giftbox:before{z-index:2;left:42%;width:16%;background:linear-gradient(90deg,#bb6578,#db99a2,#ae5269)}
.giftbox:after{z-index:4;border-color:#d28b97;top:-31px}
.gift-lid{position:absolute;z-index:3;left:-5%;top:-12%;width:110%;height:17%;border-radius:5px;background:linear-gradient(100deg,#a84860,#c86678 50%,#8b3048);box-shadow:0 7px 10px #55172b45;transform-origin:14% 100%;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.gift-plinth{position:absolute;z-index:0;bottom:1%;width:min(230px,100%);height:12%;border-radius:50%;background:radial-gradient(ellipse,#8d344d66 0%,#8d344d30 45%,transparent 72%);transition:transform .4s}
.gift-calendar .giftbox{background:linear-gradient(100deg,#6d263f,#98475b 46%,#70263d)}
.gift-calendar .gift-lid{background:linear-gradient(100deg,#8a3b53,#b96a7b 50%,#783047)}
.gift-reasons .giftbox{background:linear-gradient(100deg,#84283f,#b04b5d 46%,#81263c)}
.gift-reasons .gift-lid{background:linear-gradient(100deg,#a53e55,#d07883 50%,#96354d)}
.gift:hover .giftbox{transform:translateY(-11px) rotate(-1deg);filter:brightness(1.08)}
.gift:hover .gift-lid{transform:translateY(-7px) rotate(-8deg)}
.gift:hover .gift-plinth{transform:scaleX(.88)}
.gift.opening{background:#f4dfe2;border-color:#a84e6252;animation:giftCardIn .4s both}
.gift.opening .giftbox{animation:giftBoxLift .72s cubic-bezier(.15,.85,.22,1) both}
.gift.opening .gift-lid{animation:lidFly .72s cubic-bezier(.2,.8,.2,1) both}
.gift.opening .gift-plinth{animation:plinthPulse .72s ease both}
.gift-label{font-family:"DM Serif Display",Georgia,serif;font-size:20px;margin-top:12px;padding:0;background:none;border-radius:0;color:#70253b}
.gift:hover .gift-label{transform:none;background:none}
.gift-caption{margin-top:3px;font-size:11px;font-weight:500;letter-spacing:.25px;color:#784657}
.gift1-layout{perspective:1200px}
.mini{position:relative;overflow:hidden;border:7px solid #f4e3e4;box-shadow:0 8px 18px #56182b35;border-radius:2px;transform-origin:center bottom}
.mini:after,.g2-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(130deg,transparent 30%,#fff5 48%,transparent 66%);transform:translateX(-130%);animation:photoGlint 4.5s ease-in-out 1.2s infinite}
.envelope{overflow:visible;background:linear-gradient(145deg,#bc697b,#d38a98);border-radius:4px 4px 9px 9px;transform-origin:center bottom;box-shadow:0 22px 38px #48112555}
.envelope:before{z-index:1;inset:0;border:0;background:#f1d5d9;clip-path:polygon(0 0,100% 0,50% 56%);transform-origin:top;transition:transform .48s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 3px 3px #56182b27)}
.envelope:after{z-index:2;inset:0;left:0;right:0;bottom:0;border:0;background:#d99aa5;clip-path:polygon(0 100%,0 48%,50% 76%,100% 48%,100% 100%)}
.letter-seal{position:absolute;z-index:4;left:50%;top:54%;transform:translate(-50%,-50%);width:36px;height:36px;display:grid;place-items:center;border:2px solid #f3dadd;border-radius:50%;background:#8a3048;color:#f9e7e8;box-shadow:0 3px 9px #55172b40;transition:opacity .2s,transform .3s}
.open-text{top:auto;bottom:13px;z-index:5;border:1px solid #fff8;background:#fff1f0eF;box-shadow:0 5px 13px #56182b25;text-decoration:none;letter-spacing:1px}
.envelope:hover .letter-seal{transform:translate(-50%,-50%) scale(1.14)}
.envelope.opening:before{transform:rotateX(180deg);z-index:3}
.envelope.opening .letter-seal{opacity:0;transform:translate(-50%,-50%) scale(.3)}
.letter-page{perspective:1000px;transform-origin:top center}
.letter-photo{position:relative;overflow:hidden;padding:12px 12px 34px;border:8px solid #f8eeec;border-bottom-width:28px;box-shadow:0 15px 30px #56182b35;transform:rotate(3deg);transform-origin:center;animation:photoFloat 5s ease-in-out 1.4s infinite}
.letter-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#fff5,transparent 50%);pointer-events:none}
.letter-page p{opacity:0;animation:letterLineIn .7s ease both}
.letter-page p:nth-of-type(1){animation-delay:.65s}.letter-page p:nth-of-type(2){animation-delay:.9s}.letter-page p:nth-of-type(3){animation-delay:1.15s}
.note-panel p{color:#542738}
#letter .letter-page p{opacity:1;animation:none}
#letter.active .letter-page p{opacity:0;animation:letterLineIn .7s ease both}
#letter.active .letter-page p:nth-of-type(1){animation-delay:.65s}
#letter.active .letter-page p:nth-of-type(2){animation-delay:.9s}
#letter.active .letter-page p:nth-of-type(3){animation-delay:1.15s}
#gift2{background:radial-gradient(ellipse at 50% 45%,#b85c70 0%,#873047 57%,#642137 100%)}
.gift2-layout{width:min(1040px,100%);min-height:min(690px,78svh);padding:clamp(30px,6vw,72px);grid-template-columns:1.05fr .95fr;gap:clamp(20px,5vw,62px);border:1px solid #fff6;border-radius:5px;background:linear-gradient(135deg,#f0d8da,#d9adb5 53%,#c57e8d);box-shadow:0 35px 80px #35102170,inset 0 0 0 9px #f8e8e8a6;transform-origin:center;perspective:1400px}
#gift2.active{animation:giftTwoScene .9s cubic-bezier(.2,.85,.2,1) both}
#gift2.active .gift2-layout{animation:calendarFlipIn 1.1s cubic-bezier(.18,.8,.24,1) .12s both}
.calendar-page{align-self:center;padding:15px 5px 20px}
.calendar-page:before{content:"OUR ANNIVERSARY";top:-39px;color:#713047;font-size:10px;font-weight:700;letter-spacing:3px}
.calendar-page:after{content:"13  /  14";left:0;top:auto;bottom:-25px;font-family:Poppins,sans-serif;font-size:10px;letter-spacing:4px;color:#762b43}
.daytitle{position:relative;isolation:isolate;width:100%;max-width:430px;padding:clamp(28px,5vw,50px);font-size:clamp(51px,6.4vw,76px);line-height:.82;color:#fff3f1;background:linear-gradient(140deg,#7b2a43,#a5445b 55%,#76263e);box-shadow:0 25px 48px #501a314a;transform:rotate(-4deg);text-shadow:0 3px 0 #65223b}
.daytitle:after{content:"";position:absolute;z-index:-1;inset:10px;border:1px solid #efcdd1a8;pointer-events:none}
.calendar-decor{font-size:43px;color:#8f3e53;margin-top:32px;letter-spacing:10px}
.g2-photos{gap:22px;align-content:center;perspective:800px}
.g2-photo{height:clamp(155px,24vw,225px);position:relative;overflow:hidden;border:10px solid #f8eeee;background:linear-gradient(145deg,#b96376,#87364d);box-shadow:0 15px 28px #5b1b3550;border-radius:2px;transform:rotate(3deg);transform-origin:center}
.g2-photo:nth-child(2){transform:translateX(16px) rotate(-3deg)}
#gift2.active .g2-photo:first-child{animation:polaroidDrop .75s cubic-bezier(.2,.8,.2,1) .56s both}
#gift2.active .g2-photo:nth-child(2){animation:polaroidDrop .75s cubic-bezier(.2,.8,.2,1) .78s both}
#gift1.active .note-panel{animation:noteFlyIn .85s cubic-bezier(.2,.8,.2,1) .12s both}
#gift1.active .mini:nth-child(1){animation:polaroidDrop .72s cubic-bezier(.2,.8,.2,1) .2s both}
#gift1.active .mini:nth-child(2){animation:polaroidDrop .72s cubic-bezier(.2,.8,.2,1) .38s both}
#gift1.active .mini:nth-child(3){animation:polaroidDrop .72s cubic-bezier(.2,.8,.2,1) .56s both}
#gift1.active .envelope{animation:envelopeArrival .85s cubic-bezier(.2,.8,.2,1) .62s both}
#letter.active .letter-page{animation:letterUnfold 1s cubic-bezier(.2,.8,.2,1) both}
#letter.active .letter-page h2{opacity:0;animation:letterLineIn .65s ease .38s both}
#gift3.active .g3-photo{animation:polaroidDrop .9s cubic-bezier(.2,.8,.2,1) .15s both}
#gift3.active .twentyone{animation:numberPop .8s cubic-bezier(.15,.8,.2,1) .38s both}
#reasons.active .notebook{animation:notebookReveal .85s cubic-bezier(.2,.8,.2,1) both}
#reasons.active .notebook li{opacity:0;animation:letterLineIn .45s ease both}
#reasons.active .notebook li:nth-child(3n+1){animation-delay:.2s}
#reasons.active .notebook li:nth-child(3n+2){animation-delay:.32s}
#reasons.active .notebook li:nth-child(3n){animation-delay:.44s}
@keyframes giftCardIn{from{opacity:0;transform:translateY(38px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes giftBoxLift{35%{transform:translateY(-22px) rotate(-4deg) scale(1.08)}65%{transform:translateY(0) rotate(3deg) scale(1.02)}100%{transform:translateY(-8px) rotate(0) scale(1.04)}}
@keyframes lidFly{35%{transform:translate(22px,-82px) rotate(22deg)}60%{transform:translate(30px,-70px) rotate(32deg)}100%{transform:translate(24px,-92px) rotate(28deg);opacity:0}}
@keyframes plinthPulse{45%{transform:scale(1.16);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes photoGlint{0%,25%{transform:translateX(-130%)}52%,100%{transform:translateX(130%)}}
@keyframes photoFloat{50%{transform:translateY(-7px) rotate(1deg)}}
@keyframes letterLineIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes noteFlyIn{from{opacity:0;transform:translateX(-90px) rotate(-8deg)}to{opacity:1;transform:rotate(-1.5deg)}}
@keyframes envelopeArrival{from{opacity:0;transform:translateX(90px) rotate(8deg) scale(.88)}to{opacity:1;transform:translateX(0) rotate(0) scale(1)}}
@keyframes polaroidDrop{0%{opacity:0;transform:translateY(-45px) rotate(-9deg) scale(.92)}68%{opacity:1;transform:translateY(6px) rotate(4deg) scale(1.025)}100%{opacity:1;transform:translateY(0) rotate(0) scale(1)}}
@keyframes letterUnfold{0%{opacity:0;transform:perspective(1200px) rotateX(-55deg) translateY(60px) scale(.88)}70%{opacity:1;transform:perspective(1200px) rotateX(7deg) translateY(-5px) scale(1.01)}100%{opacity:1;transform:perspective(1200px) rotateX(0) translateY(0) scale(1)}}
@keyframes giftTwoScene{from{opacity:0}to{opacity:1}}
@keyframes calendarFlipIn{0%{opacity:0;transform:perspective(1400px) rotateY(72deg) scale(.86)}75%{opacity:1;transform:perspective(1400px) rotateY(-7deg) scale(1.015)}100%{opacity:1;transform:perspective(1400px) rotateY(0) scale(1)}}
@keyframes numberPop{0%{opacity:0;transform:scale(.3) rotate(-18deg)}72%{opacity:1;transform:scale(1.12) rotate(5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes notebookReveal{from{opacity:0;transform:perspective(1000px) rotateY(-22deg) translateX(50px)}to{opacity:1;transform:perspective(1000px) rotateY(0) translateX(0)}}

<body>
<main>

<section id="password" class="screen active">
<div class="brand">OPENWITHLOVE</div>
<div class="pass-wrap">
<div class="pass-left"><div class="heart-frame"><label class="photo photo-slot" data-photo-key="cover"><input type="file" accept="image/*" aria-label="Add your couple photo"><span class="photo-placeholder"></span></label><span class="heart-tear left" aria-hidden="true"></span><span class="heart-tear right" aria-hidden="true"></span></div></div>
<div class="pass-right"><div class="pass-card">
<div class="lock">🔒</div><h2 data-config-text="passcodePrompt"></h2>
<div class="boxes" id="boxes"><div class="box active"></div><div class="box"></div><div class="box"></div><div class="box"></div></div>
<div class="keypad">
<button class="key" onclick="press('1')">1</button><button class="key" onclick="press('2')">2</button><button class="key" onclick="press('3')">3</button>
<button class="key" onclick="press('4')">4</button><button class="key" onclick="press('5')">5</button><button class="key" onclick="press('6')">6</button>
<button class="key" onclick="press('7')">7</button><button class="key" onclick="press('8')">8</button><button class="key" onclick="press('9')">9</button>
<button class="key" onclick="press('*')">*</button><button class="key" onclick="press('0')">0</button><button class="key" onclick="press('#')">#</button>
<button class="key enter" onclick="check()" data-config-text="enter"></button></div></div></div></div>
<div id="error" class="error-layer"><div><div class="error-title" data-config-text="wrongPasscode"></div><div class="stamp" data-config-text="errorStamp"></div><br><button class="btn" onclick="again()" data-config-text="tryAgain"></button></div></div>
</section>

<section id="surprise" class="screen">
<div class="brand" data-config-text="brand"></div><div class="choice-wrap">
<div id="memorySide" class="memory-side"><div class="memory-heart h1"><label class="photo2 photo-slot" data-photo-key="surpriseOne"><input type="file" accept="image/*" aria-label="Add first memory photo"><span class="photo-placeholder"></span></label></div><div class="memory-heart h2"><label class="photo2 photo-slot" data-photo-key="surpriseTwo"><input type="file" accept="image/*" aria-label="Add second memory photo"><span class="photo-placeholder"></span></label></div></div>
<div class="choice-side"><div style="font-size:13px;opacity:.9" data-config-text="surpriseIntro"></div><h1 data-config-text="surpriseQuestion"></h1><div class="couple">🧸🤍</div><div class="choice"><button class="btn" onclick="openGifts()" data-config-text="yes"></button><button class="btn" onclick="show('nope')" data-config-text="no"></button></div></div></div>
</section>

<section id="nope" class="screen"><div class="brand" data-config-text="brand"></div><div class="no-couple" aria-label="A cute bear couple">🧸🧸</div><h1 data-config-text="noResponse"></h1><button class="btn" onclick="enterSurprise()" data-config-text="tryAgain"></button></section>

<section id="gifts" class="screen">
<div class="brand" style="color:var(--red)" data-config-text="brand"></div><div class="gifts-inner"><div class="gifts-heading"><span class="scene-kicker" data-config-text="giftsKicker"></span><div class="gifts-title" data-config-text="giftsTitle"></div><p class="gifts-subtitle" data-config-text="giftsSubtitle"></p></div><div class="gift-grid">
<button class="gift" onclick="openGift(this,'gift1')"><span class="gift-scene"><span class="giftbox"><span class="gift-lid"></span></span><span class="gift-plinth"></span></span><span class="gift-label" data-config-text="loveLetterGift"></span><span class="gift-caption" data-config-text="loveLetterCaption"></span></button>
<button class="gift gift-calendar" onclick="openGift(this,'gift2')"><span class="gift-scene"><span class="giftbox"><span class="gift-lid"></span></span><span class="gift-plinth"></span></span><span class="gift-label" data-config-text="anniversaryGift"></span><span class="gift-caption" data-config-text="anniversaryCaption"></span></button>
<button class="gift gift-reasons" onclick="openGift(this,'gift3')"><span class="gift-scene"><span class="giftbox"><span class="gift-lid"></span></span><span class="gift-plinth"></span></span><span class="gift-label" data-config-text="reasonsGift"></span><span class="gift-caption" data-config-text="reasonsCaption"></span></button>
</div></div>
</section>

<section id="gift1" class="screen"><button class="back" onclick="show('gifts')" data-config-text="back"></button><div class="gift1-layout">
<div class="note-panel"><h2 data-config-text="noteHeading"></h2><p data-config-text="noteBody"></p></div>
<div class="vertical-photos"><label class="mini photo-slot" data-photo-key="letterOne"><input type="file" accept="image/*" aria-label="Add photo 1"><span class="photo-placeholder"></span></label><label class="mini photo-slot" data-photo-key="letterTwo"><input type="file" accept="image/*" aria-label="Add photo 2"><span class="photo-placeholder"></span></label><label class="mini photo-slot" data-photo-key="letterThree"><input type="file" accept="image/*" aria-label="Add photo 3"><span class="photo-placeholder"></span></label></div>
<div class="envelope" role="button" tabindex="0" onclick="openLetter(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openLetter(this)}"><span class="letter-seal">♥</span><div class="open-text" data-config-text="openLetter"></div></div>
</div></section>

<section id="letter" class="screen"><button class="back" onclick="show('gifts')" data-config-text="back"></button><div class="letter-page"><label class="letter-photo photo-slot" data-photo-key="favorite"><input type="file" accept="image/*" aria-label="Add your favorite photo"><span class="photo-placeholder"></span></label><h2 data-config-text="letterHeading"></h2><p data-config-text="letterParagraphOne"></p><p data-config-text="letterParagraphTwo"></p><p><b data-config-text="letterSignOff"></b> <span data-config-text="letterClosing"></span></p></div></section>

<section id="gift2" class="screen"><button class="back" onclick="show('gifts')" data-config-text="back"></button><div class="gift2-layout">
<div class="calendar-page" aria-label="Anniversary calendar">
<div class="calendar-heading"><button id="calendarPrevious" class="calendar-nav" type="button" aria-label="Previous month">‹</button><h2 id="calendarMonth" class="calendar-month"></h2><span id="calendarYear" class="calendar-year"></span><button id="calendarNext" class="calendar-nav" type="button" aria-label="Next month">›</button></div>
<div class="calendar-weekdays" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
<div id="calendarGrid" class="calendar-grid" role="group" aria-label="Choose your anniversary day"></div>
<p id="calendarSelectedDate" class="calendar-selected-date" aria-live="polite"></p>
<p class="calendar-heartline" data-config-text="dateHeadline"></p>
<p class="calendar-caption" data-config-text="dateCaption"></p>
<button id="calendarReset" class="calendar-reset" type="button">Reset to configured date</button>
</div>
<div class="g2-photos"><label class="g2-photo photo-slot" data-photo-key="anniversaryOne"><input type="file" accept="image/*" aria-label="Add memory photo 1"><span class="photo-placeholder"></span></label><label class="g2-photo photo-slot" data-photo-key="anniversaryTwo"><input type="file" accept="image/*" aria-label="Add memory photo 2"><span class="photo-placeholder"></span></label></div>
</div></section>

<section id="gift3" class="screen"><button class="back" onclick="show('gifts')" data-config-text="back"></button><div class="gift3-layout">
<label class="g3-photo photo-slot" data-photo-key="reasons"><input type="file" accept="image/*" aria-label="Add your couple photo"><span class="photo-placeholder"></span></label><div class="g3-copy"><div class="twentyone" data-config-count="reasons"></div><h1 data-config-text="reasonsDisplayTitle"></h1><button class="arrow" onclick="show('reasons')"><span data-config-text="reasonsButton"></span> <span aria-hidden="true">→</span></button></div>
</div></section>

<section id="reasons" class="screen reasons-screen"><button class="back" onclick="show('gifts')" data-config-text="back"></button><div class="notebook"><h2 data-config-text="reasonsHeading"></h2><div class="reasons-scroll-hint"><span data-config-text="reasonsHint"></span> <span aria-hidden="true">↓</span></div><ol id="reasonsList"></ol></div></section>

</main>
<div id="celebration" aria-hidden="true"></div>
<audio id="backgroundMusic" loop preload="metadata"></audio>
<button id="musicToggle" class="music-toggle" type="button" aria-pressed="false" hidden>♫ Play music</button>
<script>
const config=window.ANNIVERSARY_CONFIG;
if(!config)throw new Error("config.js did not load. Keep it beside index.html.");
if(!/^[0-9*#]{4}$/.test(config.passcode))throw new Error("The passcode in config.js must be exactly four keypad characters.");
if(!Array.isArray(config.text.reasons)||!config.text.reasons.length||config.text.reasons.some(reason=>typeof reason!=="string"))throw new Error("Add at least one valid item to text.reasons in config.js.");
const reasonCount=config.text.reasons.length;
const personalize=value=>value.replaceAll("{recipient}",config.names.recipient).replaceAll("{sender}",config.names.sender).replaceAll("{count}",String(reasonCount));
let entered="",correct=config.passcode;
document.title=`${config.names.sender} & ${config.names.recipient} • ${config.text.siteTitle}`;
document.querySelectorAll("[data-config-text]").forEach(element=>{
  const key=element.dataset.configText;
  const value=key==="dateHeadline"?config.date.headline:key==="dateCaption"?config.date.caption:config.text[key];
  if(typeof value!=="string")throw new Error(`Missing text setting "${key}" in config.js.`);
  element.textContent=personalize(value);
  if(value.includes("\n"))element.style.whiteSpace="pre-line";
});
document.querySelectorAll(".brand").forEach(element=>{element.textContent=config.text.brand});
document.querySelectorAll('[data-config-count="reasons"]').forEach(element=>{element.textContent=String(reasonCount)});
document.querySelectorAll(".photo-slot").forEach(slot=>{
  const key=slot.dataset.photoKey;
  const source=config.photos[key];
  if(typeof source!=="string"||!source.trim())throw new Error(`Missing photo path for "${key}" in config.js.`);
  const prompt=config.photoPrompts[key];
  if(typeof prompt!=="string")throw new Error(`Missing photo prompt for "${key}" in config.js.`);
  slot.querySelector(".photo-placeholder").textContent=prompt;
  slot.style.setProperty("--slot-image",`url("${source}")`);
  slot.style.background=`url("${source}") center/cover no-repeat`;
  slot.classList.add("has-photo");
});
const calendar=document.querySelector(".calendar-page");
calendar.dataset.anniversaryLabel=config.date.label;
function isValidAnniversaryDate(value){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
  const [year,month,day]=value.split("-").map(Number);
  const date=new Date(0);
  date.setUTCHours(0,0,0,0);
  date.setUTCFullYear(year,month-1,day);
  return year>0&&date.getUTCFullYear()===year&&date.getUTCMonth()===month-1&&date.getUTCDate()===day;
}
function normalizeAnniversaryDate(value){
  if(isValidAnniversaryDate(value))return value;
  const dayFirstMatch=/^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec(value);
  if(!dayFirstMatch)return "";
  const [,day,month,year]=dayFirstMatch;
  const normalized=`${year}-${month.padStart(2,"0")}-${day.padStart(2,"0")}`;
  return isValidAnniversaryDate(normalized)?normalized:"";
}
const configuredAnniversaryDateValue=config.date.anniversaryDate;
if(typeof configuredAnniversaryDateValue!=="string")throw new Error("The anniversary date in config.js must be a string in YYYY-MM-DD or DD-MM-YYYY format.");
const configuredAnniversaryDate=configuredAnniversaryDateValue?normalizeAnniversaryDate(configuredAnniversaryDateValue):"";
if(configuredAnniversaryDateValue&&!configuredAnniversaryDate)throw new Error("The anniversary date in config.js must be a valid YYYY-MM-DD or DD-MM-YYYY date.");
const savedAnniversaryDate=localStorage.getItem("openwithlove.anniversaryDate");
let selectedAnniversaryDate=configuredAnniversaryDate||(savedAnniversaryDate&&isValidAnniversaryDate(savedAnniversaryDate)?savedAnniversaryDate:"");
const calendarMonth=document.querySelector("#calendarMonth");
const calendarYear=document.querySelector("#calendarYear");
const calendarGrid=document.querySelector("#calendarGrid");
const calendarSelectedDate=document.querySelector("#calendarSelectedDate");
const configuredDateParts=configuredAnniversaryDate?configuredAnniversaryDate.split("-").map(Number):null;
const initialDateParts=(selectedAnniversaryDate||"").split("-").map(Number);
let calendarView=new Date(initialDateParts.length===3?initialDateParts[0]:new Date().getFullYear(),initialDateParts.length===3?initialDateParts[1]-1:new Date().getMonth(),1);
const formatAnniversaryDate=value=>{
  const [year,month,day]=value.split("-").map(Number);
  return new Intl.DateTimeFormat(undefined,{day:"numeric",month:"long",year:"numeric"}).format(new Date(year,month-1,day));
};
function renderAnniversaryCalendar(){
  const year=calendarView.getFullYear();
  const month=calendarView.getMonth();
  calendarMonth.textContent=new Intl.DateTimeFormat(undefined,{month:"long"}).format(calendarView);
  calendarYear.textContent=String(year);
  const firstDayOffset=(new Date(year,month,1).getDay()+6)%7;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=Array.from({length:firstDayOffset},()=>document.createElement("span"));
  cells.forEach(cell=>cell.className="calendar-empty");
  for(let day=1;day<=daysInMonth;day++){
    const dateValue=`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const dayButton=document.createElement("button");
    dayButton.type="button";
    dayButton.className="calendar-day";
    dayButton.textContent=String(day);
    dayButton.setAttribute("aria-label",formatAnniversaryDate(dateValue));
    dayButton.setAttribute("aria-pressed",String(dateValue===selectedAnniversaryDate));
    if(dateValue===selectedAnniversaryDate)dayButton.classList.add("selected");
    dayButton.addEventListener("click",()=>{
      selectedAnniversaryDate=dateValue;
      localStorage.setItem("openwithlove.anniversaryDate",dateValue);
      calendarView=new Date(year,month,1);
      renderAnniversaryCalendar();
    });
    cells.push(dayButton);
  }
  calendarGrid.replaceChildren(...cells);
  calendarGrid.setAttribute("aria-label",`Choose your anniversary day in ${calendarMonth.textContent} ${year}`);
  calendarSelectedDate.textContent=selectedAnniversaryDate?`Anniversary: ${formatAnniversaryDate(selectedAnniversaryDate)}`:"Select your anniversary day";
}
document.querySelector("#calendarPrevious").addEventListener("click",()=>{
  calendarView=new Date(calendarView.getFullYear(),calendarView.getMonth()-1,1);
  renderAnniversaryCalendar();
});
document.querySelector("#calendarNext").addEventListener("click",()=>{
  calendarView=new Date(calendarView.getFullYear(),calendarView.getMonth()+1,1);
  renderAnniversaryCalendar();
});
document.querySelector("#calendarReset").addEventListener("click",()=>{
  selectedAnniversaryDate=configuredAnniversaryDate;
  if(configuredAnniversaryDate){
    localStorage.removeItem("openwithlove.anniversaryDate");
    const [year,month]=configuredDateParts;
    calendarView=new Date(year,month-1,1);
  }else{
    selectedAnniversaryDate="";
    localStorage.removeItem("openwithlove.anniversaryDate");
    calendarView=new Date(new Date().getFullYear(),new Date().getMonth(),1);
  }
  renderAnniversaryCalendar();
});
renderAnniversaryCalendar();
document.querySelector("#reasonsList").replaceChildren(...config.text.reasons.map(reason=>{
  const item=document.createElement("li");
  item.textContent=reason;
  return item;
}));
document.querySelector(".arrow").setAttribute("aria-label",personalize(config.text.reasonsButton));
const music=document.getElementById("backgroundMusic");
const musicToggle=document.getElementById("musicToggle");
music.src=config.music.src;
music.volume=Math.min(1,Math.max(0,Number(config.music.volume)));
function updateMusicButton(label,isPlaying){musicToggle.textContent=label;musicToggle.setAttribute("aria-pressed",String(isPlaying))}
updateMusicButton(config.music.playLabel,false);
async function playMusic(){
  try{
    await music.play();
    updateMusicButton(config.music.pauseLabel,true);
  }catch(error){
    updateMusicButton(error.name==="NotAllowedError"?config.music.tapToPlayLabel:config.music.errorLabel,false);
  }
}
musicToggle.addEventListener("click",()=>{
  if(music.paused)playMusic();
  else{music.pause();updateMusicButton(config.music.playLabel,false)}
});
music.addEventListener("pause",()=>updateMusicButton(config.music.playLabel,false));
music.addEventListener("play",()=>updateMusicButton(config.music.pauseLabel,true));
music.addEventListener("error",()=>updateMusicButton(config.music.errorLabel,false));
function celebrate(count=16){const layer=document.getElementById("celebration");const colors=["#D11A2A","#e45b68","#f3b7bd","#ffd64a"];for(let i=0;i<count;i++){const heart=document.createElement("span");heart.className="love-particle";heart.textContent=i%5===0?"✦":"♥";heart.style.setProperty("--x",`${Math.random()*100}vw`);heart.style.setProperty("--drift",`${Math.random()*120-60}px`);heart.style.setProperty("--duration",`${2.1+Math.random()*2.1}s`);heart.style.setProperty("--delay",`${Math.random()*.38}s`);heart.style.setProperty("--size",`${13+Math.random()*22}px`);heart.style.setProperty("--particle-color",colors[Math.floor(Math.random()*colors.length)]);heart.addEventListener("animationend",()=>heart.remove(),{once:true});layer.appendChild(heart)}}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));if(id==="gift1")document.querySelector(".envelope").classList.remove("opening");document.getElementById(id).classList.add("active");window.scrollTo(0,0);celebrate(id==="surprise"||id==="gifts"?24:14)}
function openGift(button,id){if(button.disabled)return;button.disabled=true;button.classList.add("opening");celebrate(20);setTimeout(()=>{button.classList.remove("opening");button.disabled=false;show(id)},720)}
function openLetter(envelope){if(envelope.classList.contains("opening"))return;envelope.classList.add("opening");setTimeout(()=>show("letter"),680)}
function boxes(){document.querySelectorAll("#boxes .box").forEach((b,i)=>{b.textContent=entered[i]||"";b.classList.toggle("active",i===entered.length)})}
function press(v){if(entered.length>=4)return;entered+=v;boxes();let b=document.querySelectorAll("#boxes .box")[entered.length-1];b.animate([{transform:"translateY(-18px) scale(.7)",opacity:0},{transform:"translateY(0) scale(1.1)",opacity:1},{transform:"scale(1)",opacity:1}],{duration:420,easing:"cubic-bezier(.2,.9,.2,1)"});if(entered.length===4)setTimeout(check,380)}
function check(){if(entered===correct){musicToggle.hidden=false;enterSurprise();if(config.music.autoplayAfterUnlock)playMusic()}else document.getElementById("error").classList.add("show")}
function again(){document.getElementById("error").classList.remove("show");entered="";boxes()}
function enterSurprise(){show("surprise");setTimeout(()=>document.getElementById("memorySide").classList.add("revealed"),120)}
function openGifts(){show("gifts")}
function replayHeartReveal(){const frame=document.querySelector("#password .heart-frame");frame.querySelectorAll(".heart-tear").forEach(half=>{half.style.animation="none"});void frame.offsetWidth;frame.querySelectorAll(".heart-tear").forEach(half=>{half.style.animation=""})}
document.querySelectorAll(".photo-slot input[type='file']").forEach(input=>input.addEventListener("change",()=>{const file=input.files[0];if(!file||!file.type.startsWith("image/"))return;const slot=input.closest(".photo-slot");const previousUrl=slot.dataset.photoUrl;if(previousUrl)URL.revokeObjectURL(previousUrl);const photoUrl=URL.createObjectURL(file);slot.style.setProperty("--slot-image",`url("${photoUrl}")`);slot.style.background=`url("${photoUrl}") center/cover no-repeat`;slot.dataset.photoUrl=photoUrl;slot.classList.add("has-photo");if(slot.closest("#password"))replayHeartReveal();input.value=""}));
document.addEventListener("click",e=>{if(e.target.closest("#surprise"))document.getElementById("memorySide").classList.add("revealed")});
boxes();
</script>
</body>
</html>
